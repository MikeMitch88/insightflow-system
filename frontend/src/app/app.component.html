<div class="app-layout" *ngIf="isLoggedIn(); else loginTpl">
  <aside class="sidebar" [class.collapsed]="!sidebarOpen">
    <div class="sidebar-header">
      <h1>InsightFlow System</h1>
      <p>Program Intelligence Platform</p>
    </div>
    <nav class="sidebar-nav">
      <ng-container *ngFor="let section of filteredNavSections">
        <div class="sidebar-section">{{ section.label }}</div>
        <a *ngFor="let item of section.items"
           class="sidebar-link"
           [class.active]="isActive(item.route)"
           [routerLink]="item.route">
          <span class="material-icons-outlined">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
          <span *ngIf="item.route === '/reports' && pendingReportsCount > 0" class="badge badge-danger" style="margin-left:auto;border-radius:10px;padding:2px 6px;font-size:10px;">
            🔴 {{ pendingReportsCount }}
          </span>
          <span *ngIf="item.route === '/admin' && unreadNotifCount > 0" class="badge badge-danger" style="margin-left:auto;border-radius:10px;padding:2px 6px;font-size:10px;">
            🔴 {{ unreadNotifCount }}
          </span>
        </a>
      </ng-container>
    </nav>
    <div class="sidebar-footer">
      <div><span class="status-dot"></span>System Status: All systems operational</div>
      <div class="user-info">
        <div class="user-avatar">{{ userInitials }}</div>
        <div>
          <div style="font-weight:600">{{ userName }}</div>
          <div style="color:rgba(255,255,255,0.5);font-size:10px">{{ userRoleLabel }}</div>
          <div style="color:rgba(255,255,255,0.35);font-size:10px">{{ userEmail }}</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn btn-sm btn-secondary" (click)="toggleSidebar()" style="display:none">
          <span class="material-icons-outlined" style="font-size:18px">menu</span>
        </button>
        <span class="topbar-title">KPC InsightFlow AI</span>
      </div>

      <!-- Fast Role Switcher for Hackathon Testing -->
      <div class="role-switcher" style="display:flex;align-items:center;gap:8px;background:rgba(0,0,0,0.04);padding:4px 8px;border-radius:8px;font-size:12px;">
        <span style="font-weight:600;color:var(--text-secondary);">Test Role:</span>
        <button
          class="btn btn-sm"
          [ngClass]="auth.currentUser?.role === 'admin' ? 'btn-primary' : 'btn-secondary'"
          (click)="switchRole('admin')"
          style="padding:2px 8px;font-size:11px;"
          title="Switch to Administrator (Generates reports)"
        >
          Admin
        </button>
        <button
          class="btn btn-sm"
          [ngClass]="auth.currentUser?.role === 'program_manager' ? 'btn-primary' : 'btn-secondary'"
          (click)="switchRole('program_manager')"
          style="padding:2px 8px;font-size:11px;"
          title="Switch to Program Manager (Reviews & approves reports)"
        >
          Manager (Grace W.)
        </button>
      </div>

      <div class="topbar-actions">
        <button class="btn btn-sm btn-secondary" routerLink="/admin" title="Notifications">
          <span class="material-icons-outlined" style="font-size:16px">notifications</span>
          <span *ngIf="unreadNotifCount > 0" class="badge badge-danger" style="font-size:9px;padding:2px 4px;margin-left:4px;">{{ unreadNotifCount }}</span>
        </button>
        <button class="btn btn-sm btn-secondary">
          <span class="material-icons-outlined" style="font-size:16px">help</span>
        </button>
        <button class="btn btn-sm btn-primary" routerLink="/ai-assistant" *ngIf="auth.hasPermission('ai-assistant')">
          <span class="material-icons-outlined" style="font-size:16px">smart_toy</span>
          AI Assistant
        </button>
        <button class="btn btn-sm btn-secondary" (click)="logout()" title="Sign Out">
          <span class="material-icons-outlined" style="font-size:16px">logout</span>
        </button>
      </div>
    </header>
    <router-outlet></router-outlet>
  </div>
</div>

<ng-template #loginTpl>
  <router-outlet></router-outlet>
</ng-template>

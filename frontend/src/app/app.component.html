<div class="app-layout">
  <aside class="sidebar" [class.collapsed]="!sidebarOpen">
    <div class="sidebar-header">
      <h1>Insightflow system</h1>
      <p>Program Intelligence Platform</p>
    </div>
    <nav class="sidebar-nav">
      <ng-container *ngFor="let section of navSections">
        <div class="sidebar-section">{{ section.label }}</div>
        <a *ngFor="let item of section.items"
           class="sidebar-link"
           [class.active]="isActive(item.route)"
           [routerLink]="item.route">
          <span class="material-icons-outlined">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      </ng-container>
    </nav>
    <div class="sidebar-footer">
      <div><span class="status-dot"></span>System Status: All systems operational</div>
      <div class="user-info">
        <div class="user-avatar">PA</div>
        <div>
          <div style="font-weight:600">Program Administrator</div>
          <div style="color:rgba(255,255,255,0.4);font-size:10px">admin@inukafoundation.org</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn btn-sm btn-secondary" (click)="toggleSidebar()" style="display:none">
          <span class="material-icons-outlined" style="font-size:18px">menu</span>
        </button>
        <span class="topbar-title">Insightflow system</span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-sm btn-secondary">
          <span class="material-icons-outlined" style="font-size:16px">notifications</span>
        </button>
        <button class="btn btn-sm btn-secondary">
          <span class="material-icons-outlined" style="font-size:16px">help</span>
        </button>
        <button class="btn btn-sm btn-primary" routerLink="/ai-assistant">
          <span class="material-icons-outlined" style="font-size:16px">smart_toy</span>
          AI Assistant
        </button>
      </div>
    </header>
    <router-outlet></router-outlet>
  </div>
</div>
